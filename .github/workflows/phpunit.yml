name: PHPUnit

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        wp: ['latest']
        include:
          - php: '8.3'
            wp: '6.8.2'
          - php: '8.4'
            wp: '7.1'

    services:
      mysql:
        image: mariadb:10.11
        ports:
          - '3306:3306'
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MARIADB_INITDB_SKIP_TZINFO: 1
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Set up WordPress and WordPress Test Library
        uses: sjinks/setup-wordpress-test-library@v3
        with:
          version: ${{ matrix.wp }}

      - name: Adjust wp-tests-config for older PHP
        if: ${{ matrix.php == '7.4' || matrix.php == '8.0' }}
        run: |
          sed -i "s@define( 'WP_DEBUG', true );@// define( 'WP_DEBUG', true );@" "${WP_TESTS_DIR}/wp-tests-config.php"

      - name: Verify database connection
        run: |
          while ! mysqladmin ping -h 127.0.0.1 -P 3306 -uwordpress -pwordpress --silent; do
            sleep 1
          done
        timeout-minutes: 1

      - name: Run tests
        run: composer test
